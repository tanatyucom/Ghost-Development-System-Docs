validation_rules:
  - rule_id: repository.unique_id
    statement: repository_id must be unique.
    failure_result: BLOCK
  - rule_id: repository.active_requires_verified_root
    statement: Active repositories require a verified root and branch basis.
    failure_result: SCW_REQUIRED
  - rule_id: repository.planned_is_not_execution_target
    statement: Planned repositories use NONE and cannot be execution targets.
    failure_result: BLOCK
  - rule_id: repository.role_is_capability
    statement: Supported role does not replace Q-specific role assignment.
    failure_result: BLOCK
  - rule_id: repository.mutation_class_is_not_authority
    statement: Mutation class must not elevate Q-specific authority.
    failure_result: SCW_REQUIRED
