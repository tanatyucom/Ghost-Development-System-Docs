name: AI Repository Index Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-repository-index:
    name: Validate AI Repository Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The validators use only the Python standard library. There are no
      # third-party validation dependencies to install or leave unpinned.
      - name: Generate canonical AI Repository Index
        run: python scripts/generate_ai_repository_index.py --write

      - name: Validate AI Repository Index structure
        run: python scripts/generate_ai_repository_index.py --validate

      - name: Validate encoding regression
        run: python scripts/validate_encoding_regression.py --all

      - name: Check generated diff formatting
        run: git diff --check

      - name: Check generated index freshness
        shell: bash
        run: |
          if ! git diff --exit-code -- docs/ai_repository_index.md; then
            echo "::error title=AI_REPOSITORY_INDEX_STALE::The AI Repository Index is stale. Run 'python scripts/generate_ai_repository_index.py --write', review docs/ai_repository_index.md, validate it, and include the regenerated file in the commit."
            exit 1
          fi
